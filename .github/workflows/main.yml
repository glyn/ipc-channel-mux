name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

jobs:
  msrv_build:
    name: ${{ format('MSRV {0} {1}', matrix.platform.target, matrix.features)}}
    runs-on: ${{ matrix.platform.os }}
    env:
      RUST_BACKTRACE: 1
    strategy:
      matrix:
        platform:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
        features: [""]
    steps:
      - uses: actions/checkout@v4

      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@1.86
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.platform.target }}

      - name: clippy
        uses: servo/actions/cargo-annotation@main
        with:
          cargo-command: clippy --features '${{ matrix.features }}' --target '${{ matrix.platform.target }}'
          with-annotation: ${{ matrix.platform.target == 'x86_64-unknown-linux-gnu' && matrix.features == '' }}
      - name: build
        run: cargo build --features "${{ matrix.features }}"


  test:
    name: ${{ format('{0} {1}', matrix.platform.target, matrix.features)}}
    runs-on: ${{ matrix.platform.os }}
    env:
      RUST_BACKTRACE: 1
    strategy:
      matrix:
        platform:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: i686-pc-windows-msvc, os: windows-latest }
        features: [""]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.platform.target }}

      - name: rustfmt
        run: cargo fmt --check

      - name: Install procdump
        if: contains(matrix.platform.target, 'windows')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Procdump.zip" -OutFile "${{ runner.temp }}\Procdump.zip"
          Expand-Archive -Path "${{ runner.temp }}\Procdump.zip" -DestinationPath "${{ runner.temp }}\Procdump"
          New-Item -Path "${{ github.workspace }}\CrashDumps" -ItemType Directory -Force

      - name: Cargo test
        if: "!contains(matrix.platform.target, 'windows')"
        run: cargo test --features "${{ matrix.features }}" --target ${{ matrix.platform.target }} -- --nocapture
        env:
          RUST_MIN_STACK: ${{ contains(matrix.platform.target, 'windows') && '16777216' || '' }}

      - name: Build tests (Windows)
        if: contains(matrix.platform.target, 'windows')
        run: cargo test --features "${{ matrix.features }}" --target ${{ matrix.platform.target }} --no-run 2>&1 | tee "${{ runner.temp }}\build-output.txt"
        env:
          RUST_MIN_STACK: ${{ contains(matrix.platform.target, 'windows') && '16777216' || '' }}

      - name: Run tests under procdump (Windows)
        if: contains(matrix.platform.target, 'windows')
        shell: pwsh
        run: |
          # Prevent PowerShell 7.4+ from treating non-zero native exit codes as errors.
          # procdump exits 1 when no dumps are captured (i.e. tests pass).
          $PSNativeCommandUseErrorActionPreference = $false
          $buildOutput = Get-Content "${{ runner.temp }}\build-output.txt" -Raw
          $testExes = [regex]::Matches($buildOutput, 'Executable.*\(([^)]+)\)') | ForEach-Object { $_.Groups[1].Value }
          foreach ($exe in $testExes) {
            Write-Host "Running under procdump: $exe"
            & "${{ runner.temp }}\Procdump\procdump.exe" -accepteula -e -ma -x "${{ github.workspace }}\CrashDumps" $exe --nocapture
            # procdump exit code is about dump capture, not the child process.
            # Check for dump files to detect a crash.
            $dumps = Get-ChildItem "${{ github.workspace }}\CrashDumps" -Filter "*.dmp" -ErrorAction SilentlyContinue
            if ($dumps) {
              Write-Host "Crash dump(s) captured: $($dumps.Name -join ', ')"
              exit 1
            }
          }
          exit 0
        env:
          RUST_MIN_STACK: ${{ contains(matrix.platform.target, 'windows') && '16777216' || '' }}

      - name: Upload crash dumps
        if: failure() && contains(matrix.platform.target, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps-${{ matrix.platform.target }}
          path: ${{ github.workspace }}/CrashDumps/
          if-no-files-found: ignore

  build_result:
    name: Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - "test"

    steps:
      - name: Success
        run: exit 0
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
      - name: Failure
        run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
