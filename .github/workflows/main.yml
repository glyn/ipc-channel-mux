name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

jobs:
  msrv_build:
    name: ${{ format('MSRV {0} {1}', matrix.platform.target, matrix.features)}}
    runs-on: ${{ matrix.platform.os }}
    env:
      RUST_BACKTRACE: 1
    strategy:
      matrix:
        platform:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
        features: [""]
    steps:
      - uses: actions/checkout@v4

      - name: Install minimum supported Rust toolchain
        uses: dtolnay/rust-toolchain@1.86
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.platform.target }}

      - name: clippy
        uses: servo/actions/cargo-annotation@main
        with:
          cargo-command: clippy --features '${{ matrix.features }}' --target '${{ matrix.platform.target }}'
          with-annotation: ${{ matrix.platform.target == 'x86_64-unknown-linux-gnu' && matrix.features == '' }}
      - name: build
        run: cargo build --features "${{ matrix.features }}"


  test:
    name: ${{ format('{0} {1}', matrix.platform.target, matrix.features)}}
    runs-on: ${{ matrix.platform.os }}
    env:
      RUST_BACKTRACE: 1
    strategy:
      matrix:
        platform:
          - { target: aarch64-apple-darwin, os: macos-14 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: i686-pc-windows-msvc, os: windows-latest }
        features: [""]
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.platform.target }}

      - name: rustfmt
        run: cargo fmt --check

      - name: Install procdump
        if: contains(matrix.platform.target, 'windows')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://download.sysinternals.com/files/Procdump.zip" -OutFile "${{ runner.temp }}\Procdump.zip"
          Expand-Archive -Path "${{ runner.temp }}\Procdump.zip" -DestinationPath "${{ runner.temp }}\Procdump"
          & "${{ runner.temp }}\Procdump\procdump.exe" -accepteula -i "${{ github.workspace }}\CrashDumps"

      - name: Cargo test
        run: cargo test --features "${{ matrix.features }}" --target ${{ matrix.platform.target }} -- --nocapture
        env:
          RUST_MIN_STACK: ${{ contains(matrix.platform.target, 'windows') && '16777216' || '' }}

      - name: Uninstall procdump
        if: always() && contains(matrix.platform.target, 'windows')
        shell: pwsh
        run: |
          & "${{ runner.temp }}\Procdump\procdump.exe" -u

      - name: Upload crash dumps
        if: failure() && contains(matrix.platform.target, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: crash-dumps-${{ matrix.platform.target }}
          path: ${{ github.workspace }}/CrashDumps/
          if-no-files-found: ignore

  build_result:
    name: Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - "test"

    steps:
      - name: Success
        run: exit 0
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
      - name: Failure
        run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
