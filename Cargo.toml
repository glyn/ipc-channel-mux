[package]
name = "ipc-channel-multiplexer"
version = "0.0.1"
description = "Multiplexing for servo/ipc-channel"
authors = ["The Servo Project Developers"]
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/glyn/ipc-channel-multiplexer"
edition = "2021"

[features]
default = []
force-inprocess = []
async = ["dep:futures-core", "dep:futures-channel"]
win32-trace = []
enable-slow-tests = []

[dependencies]
bincode = "1"
crossbeam-channel = "0.5"
enclose = "1.2.1"
fnv = "1.0.3"
futures-channel = { version = "0.3.31", optional = true }
futures-core = { version = "0.3.31", optional = true }
hashbag = "0.1.12"
ipc-channel = "0.20.2"
lazy_static = "1"
libc = "0.2.162"
log = "0.4.26"
serde = { version = "1.0", features = ["derive", "rc"] }
tracing = { version = "0.1.41", features = ["log"] }
uuid = { version = "1", features = ["v4", "serde"] }
weak-table = "0.3.2"

[target.'cfg(any(target_os = "linux", target_os = "openbsd", target_os = "freebsd", target_os = "illumos"))'.dependencies]
mio = { version = "1.0", default-features = false, features = ["os-ext"] }
tempfile = "3.4"

[target.'cfg(target_os = "macos")'.dependencies]
rand = "0.9"

[dev-dependencies]
crossbeam-utils = "0.8"
futures-test = "0.3"
static_assertions = "1.1.0"
test-log = "0.2.17"
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.9.2"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_WindowsProgramming",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_System_Memory",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
]
